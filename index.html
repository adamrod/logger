<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logger</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Logger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/app.js"></script>
<script type="module" src="js/app-version.js"></script>
</head>
<body>
<div class="app">
  <header class="top-bar">
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="#log">Sets</a>
      <a class="tab" href="#body-weight">Weight</a>
    </nav>
    <div class="undo-actions">
      <button type="button" class="undo-button" id="undo" aria-label="Undo" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button type="button" class="undo-button" id="redo" aria-label="Redo" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <a class="icon-button settings-link" href="#settings" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </div>
  </header>

  <section class="screen" id="screen-log" hidden>
    <div class="log-form">
      <div class="field">
        <div class="label-row">
          <span class="label" id="exercise-label">Exercise</span>
          <div class="label-actions">
            <button type="button" class="btn-text" id="variant-new" data-action="start-add">+ Variant</button>
            <button type="button" class="btn-text" id="note-toggle" aria-controls="note-field" aria-expanded="false">+ Notes</button>
            <a class="text-link" id="analysis-link" href="#analysis">Analysis</a>
          </div>
        </div>
        <div id="exercise-picker">
          <div class="picker" id="exercise-select">
            <button type="button" class="picker-button" id="exercise-button" data-action="toggle"
              aria-labelledby="exercise-label exercise-button" aria-controls="exercise-menu" aria-expanded="false"></button>
            <div class="picker-menu" id="exercise-menu" hidden>
              <form class="picker-search" id="exercise-search">
                <input class="picker-query" id="exercise-query" type="search" aria-label="Search or add exercise"
                  placeholder="Search or add" autocomplete="off" enterkeyhint="go">
              </form>
              <ul class="picker-options" id="exercise-options"></ul>
            </div>
          </div>
          <form class="add-form" id="exercise-form" hidden>
            <input class="input" id="exercise-name" aria-labelledby="exercise-label" placeholder="Exercise name"
              autocomplete="off" enterkeyhint="done">
            <button class="btn btn-primary" id="exercise-submit">Add</button>
            <button type="button" class="btn-text" id="exercise-cancel" data-action="cancel-name">Cancel</button>
          </form>
        </div>
      </div>

      <div class="field" id="note-field" hidden>
        <textarea class="input note-input" id="note" aria-label="Notes" rows="3"></textarea>
      </div>

      <div class="field" id="variant-picker">
        <div class="variant-bar" id="variant-bar">
          <div class="chips chip-row variant-chips" id="variant-chips" role="group" aria-label="Variant"></div>
          <button type="button" class="btn-text chips-edit" id="variant-edit" data-action="toggle-edit"></button>
        </div>
        <form class="add-form" id="variant-add" hidden>
          <input class="input" id="variant-name" aria-label="Variant" placeholder="Variant, e.g. Left"
            autocomplete="off" enterkeyhint="done">
          <button class="btn btn-primary">Add</button>
          <button type="button" class="btn-text" data-action="cancel-add">Cancel</button>
        </form>
      </div>

      <div class="log-controls" id="log-controls">
        <div class="set-fields">
          <div class="field">
            <div class="label-row">
              <label class="label" for="reps">Reps</label>
            </div>
            <div class="stepper">
              <button type="button" class="step-btn" data-action="step" data-field="reps" data-steps="-1" aria-label="Decrease repetitions">−</button>
              <input class="input step-value" id="reps" inputmode="numeric" enterkeyhint="done" autocomplete="off">
              <button type="button" class="step-btn" data-action="step" data-field="reps" data-steps="1" aria-label="Increase repetitions">+</button>
            </div>
          </div>
          <div class="field">
            <div class="label-row">
              <label class="label" for="weight">Weight</label>
            </div>
            <div class="stepper">
              <button type="button" class="step-btn" data-action="step" data-field="weight" data-steps="-1" aria-label="Decrease weight">−</button>
              <input class="input step-value" id="weight" inputmode="decimal" enterkeyhint="done" autocomplete="off">
              <button type="button" class="step-btn" data-action="step" data-field="weight" data-steps="1" aria-label="Increase weight">+</button>
            </div>
          </div>
        </div>
        <div class="field" id="set-when-field" hidden>
          <label class="label" for="set-when">Time</label>
          <input class="input when-input" id="set-when" type="datetime-local">
        </div>
        <button type="button" class="btn btn-primary" id="log-button" data-action="log">Log</button>
        <div class="edit-actions" id="edit-actions" hidden>
          <button type="button" class="btn btn-secondary" data-action="cancel-edit">Cancel</button>
          <button type="button" class="btn btn-secondary" data-action="delete">Delete</button>
          <button type="button" class="btn btn-primary" id="save-button" data-action="save">Save</button>
        </div>
        <div class="edit-actions" id="delete-actions" hidden>
          <button type="button" class="btn btn-secondary" data-action="cancel-delete">Keep</button>
          <button type="button" class="btn btn-primary" data-action="confirm-delete">Delete</button>
        </div>
        <div class="stopwatch" id="stopwatch">
          <div class="label-row">
            <span class="label" id="stopwatch-label">Stopwatch</span>
            <label class="stopwatch-option"><input type="checkbox" class="check" id="stopwatch-reset-on-log"> Reset on log</label>
          </div>
          <div class="stopwatch-body">
            <button type="button" class="stopwatch-button" data-action="stopwatch-reset" aria-label="Reset stopwatch"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg></button>
            <span class="stopwatch-time" id="stopwatch-time" role="timer" aria-labelledby="stopwatch-label">0:00</span>
            <button type="button" class="stopwatch-button stopwatch-toggle" id="stopwatch-toggle" data-action="stopwatch-toggle" aria-label="Start stopwatch">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="stopwatch-icon" d="M8 5.5v13l10.5-6.5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="history" aria-labelledby="history-heading">
      <div class="section-head">
        <h2 class="label" id="history-heading">History</h2>
        <div class="history-sync" hidden>
          <span class="sync-text"></span>
          <button type="button" class="btn-text sync-button">Sync</button>
        </div>
      </div>
      <div class="history-list" id="history-list"></div>
    </section>
  </section>

  <section class="screen" id="screen-analysis" hidden>
    <div class="analysis">
      <div class="analysis-nav">
        <a class="text-link" href="#log">‹ Sets</a>
        <div class="toggles" id="analysis-ranges" role="group" aria-label="Analysis range">
          <button type="button" class="btn-text toggle" data-action="range" data-range="1M">1M</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="3M">3M</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="1Y">1Y</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="All">All</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="Custom">Custom</button>
        </div>
      </div>
      <div class="range-custom" id="analysis-custom" hidden>
        <input class="input date-input" id="analysis-from" type="date" aria-label="From">
        <span class="range-dash" aria-hidden="true">–</span>
        <input class="input date-input" id="analysis-to" type="date" aria-label="To">
      </div>
      <div class="analysis-head">
        <h1 class="analysis-title" id="analysis-title"></h1>
        <p class="chart-meta" id="analysis-summary"></p>
      </div>
      <div class="chips chip-row analysis-variants" id="analysis-variants" role="group" aria-label="Variant"></div>
      <p class="empty analysis-empty" id="analysis-empty" hidden>No sets in this range.</p>

      <div id="analysis-charts">
        <section class="analysis-section" aria-labelledby="daily-heading">
          <div class="section-head">
            <h2 class="label" id="daily-heading"></h2>
            <div class="toggles" id="daily-metrics" role="group" aria-label="Chart value">
              <button type="button" class="btn-text toggle" data-action="metric" data-metric="weight">Weight</button>
              <button type="button" class="btn-text toggle" id="relative-toggle" data-action="metric" data-metric="relative">%BW</button>
              <button type="button" class="btn-text toggle" data-action="metric" data-metric="reps">Reps</button>
              <button type="button" class="btn-text toggle" data-action="metric" data-metric="volume">Volume</button>
            </div>
          </div>
          <p class="chart-readout readout-grid" aria-live="polite">
            <span class="readout-main"><span class="chart-value" id="daily-value"></span> <span class="chart-meta" id="daily-detail"></span></span>
            <span class="chart-meta" id="daily-change"></span>
            <span class="chart-meta readout-when" id="daily-date"></span>
            <button type="button" class="btn-text readout-max" id="daily-max" data-action="max">Max <span class="readout-max-value" id="daily-max-value"></span></button>
          </p>
          <svg class="chart-plot" id="daily-plot" aria-hidden="true"></svg>
        </section>

        <section class="analysis-section" aria-labelledby="rep-max-heading">
          <div class="section-head">
            <h2 class="label" id="rep-max-heading">Max reps by weight</h2>
          </div>
          <p class="chart-readout readout-stacked" aria-live="polite">
            <span class="readout-text"><span class="chart-value" id="rep-max-value"></span> <span class="chart-meta readout-when" id="rep-max-date"></span></span>
          </p>
          <div class="bars" id="rep-max-bars" role="group" aria-labelledby="rep-max-heading"></div>
        </section>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-day" hidden>
    <div class="analysis">
      <div class="analysis-nav">
        <a class="text-link" href="#log">‹ Sets</a>
        <div class="day-steps" id="day-steps">
          <button type="button" class="icon-button" id="day-previous" data-action="step" data-step="previous" aria-label="Previous day">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" class="icon-button" id="day-next" data-action="step" data-step="next" aria-label="Next day">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button type="button" class="btn-text" id="day-latest" data-action="latest">Latest</button>
        </div>
      </div>
      <div class="analysis-head">
        <h1 class="analysis-title" id="day-title"></h1>
        <p class="chart-meta" id="day-summary"></p>
      </div>
      <div id="day-exercises"></div>
    </div>
  </section>

  <section class="screen" id="screen-body-weight" hidden>
    <div class="log-form">
      <div class="log-controls" id="body-weight-controls">
        <div class="field">
          <label class="label" for="body-weight">Weight</label>
          <div class="stepper">
            <button type="button" class="step-btn" data-action="step" data-steps="-1" aria-label="Decrease body weight">−</button>
            <input class="input step-value" id="body-weight" inputmode="decimal" enterkeyhint="done" autocomplete="off">
            <button type="button" class="step-btn" data-action="step" data-steps="1" aria-label="Increase body weight">+</button>
          </div>
        </div>
        <div class="field" id="body-weight-when-field" hidden>
          <label class="label" for="body-weight-when">Time</label>
          <input class="input when-input" id="body-weight-when" type="datetime-local">
        </div>
        <button type="button" class="btn btn-primary" id="body-weight-log" data-action="log">Log</button>
        <div class="edit-actions" id="body-weight-edit-actions" hidden>
          <button type="button" class="btn btn-secondary" data-action="cancel-edit">Cancel</button>
          <button type="button" class="btn btn-secondary" data-action="delete">Delete</button>
          <button type="button" class="btn btn-primary" id="body-weight-save" data-action="save">Save</button>
        </div>
        <div class="edit-actions" id="body-weight-delete-actions" hidden>
          <button type="button" class="btn btn-secondary" data-action="cancel-delete">Keep</button>
          <button type="button" class="btn btn-primary" data-action="confirm-delete">Delete</button>
        </div>
      </div>
    </div>

    <section class="chart" id="chart" aria-labelledby="chart-heading" hidden>
      <div class="section-head">
        <h2 class="label" id="chart-heading">Chart</h2>
        <div class="toggles" id="chart-ranges" role="group" aria-label="Chart range">
          <button type="button" class="btn-text toggle" data-action="range" data-range="1M">1M</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="3M">3M</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="1Y">1Y</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="All">All</button>
          <button type="button" class="btn-text toggle" data-action="range" data-range="Custom">Custom</button>
        </div>
      </div>
      <div class="range-custom" id="chart-custom" hidden>
        <input class="input date-input" id="chart-from" type="date" aria-label="From">
        <span class="range-dash" aria-hidden="true">–</span>
        <input class="input date-input" id="chart-to" type="date" aria-label="To">
      </div>
      <p class="chart-readout" aria-live="polite">
        <span><span class="chart-value" id="chart-value"></span> <span class="chart-meta" id="chart-date"></span></span>
        <span class="chart-meta" id="chart-change"></span>
      </p>
      <p class="chart-meta chart-extremes" id="chart-extremes">
        <button type="button" class="btn-text readout-max" data-action="min">Min <span id="chart-min"></span></button>
        <span aria-hidden="true">·</span>
        <button type="button" class="btn-text readout-max" data-action="max">Max <span id="chart-max"></span></button>
      </p>
      <svg class="chart-plot" id="chart-plot" aria-hidden="true"></svg>
    </section>

    <section class="history" aria-labelledby="body-weight-history-heading">
      <div class="section-head">
        <h2 class="label" id="body-weight-history-heading">History</h2>
        <div class="history-sync" hidden>
          <span class="sync-text"></span>
          <button type="button" class="btn-text sync-button">Sync</button>
        </div>
      </div>
      <div class="history-list" id="body-weight-history"></div>
    </section>
  </section>

  <section class="screen" id="screen-settings" hidden>
    <main class="settings">
      <section class="settings-section" aria-labelledby="sync-heading">
        <h2 class="label" id="sync-heading">Sync</h2>
        <div class="field">
          <label class="field-name" for="setting-owner">Owner</label>
          <input class="input" id="setting-owner" data-setting="owner" placeholder="your-username"
            autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-name" for="setting-repo">Repository</label>
          <input class="input" id="setting-repo" data-setting="repo" placeholder="logger-data"
            autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-name" for="setting-token">Token</label>
          <input class="input" id="setting-token" data-setting="token" type="password" placeholder="github_pat_…"
            autocomplete="off" spellcheck="false">
        </div>
        <div class="sync-row">
          <span class="sync-status" id="sync-status"></span>
          <button type="button" class="btn btn-primary" id="sync-now">Sync</button>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="screen-heading">
        <h2 class="label" id="screen-heading">Screen</h2>
        <div class="field">
          <label class="field-name" for="setting-screen-timeout">Timeout</label>
          <div class="select">
            <select class="input" id="setting-screen-timeout">
              <option value="0">System default</option>
              <option value="1">1 minute</option>
              <option value="2">2 minutes</option>
              <option value="5">5 minutes</option>
              <option value="10">10 minutes</option>
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
            </select>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="data-heading">
        <h2 class="label" id="data-heading">Data</h2>
        <button type="button" class="btn btn-secondary" id="export-sets">Export sets</button>
        <button type="button" class="btn btn-secondary" id="export-body-weight">Export weights</button>
      </section>

      <p class="version" id="app-version"></p>
    </main>
  </section>

</div>
</body>
</html>
